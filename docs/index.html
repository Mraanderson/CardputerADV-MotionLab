<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Motion Lab Web Flasher</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        background: #000;
        color: #00ff66;
        font-family: monospace;
        text-align: center;
        padding: 40px;
    }
    button {
        background: #000;
        color: #00ff66;
        border: 1px solid #00ff66;
        padding: 12px 20px;
        cursor: pointer;
        font-size: 1rem;
    }
    #log {
        margin-top: 20px;
        white-space: pre-wrap;
        text-align: left;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
        font-size: 0.9rem;
    }
</style>
</head>

<body>

<h1>MOTION LAB WEB FLASHER</h1>

<button id="flashBtn">Flash Device</button>

<div id="log"></div>

<!-- IMPORTANT: Use the UMD bundle that exposes window.ESPLoader -->
<script src="https://unpkg.com/esptool-js@0.4.4/bundle.js"></script>

<script>
async function flash() {
    const logBox = document.getElementById("log");
    const log = msg => logBox.textContent += msg + "\n";

    try {
        log("Loading manifest...");
        const manifest = await fetch("manifest.json").then(r => r.json());
        const build = manifest.builds[0];

        log("Requesting serial port...");
        const port = await navigator.serial.requestPort();

        // This version exposes ESPLoader globally
        const loader = new ESPLoader(port, { log });

        log("Connecting...");
        await loader.connect();

        log("Connected. Flashing parts...");
        for (const part of build.parts) {
            log(`Flashing ${part.path} @ 0x${part.offset.toString(16)}`);
            const data = await fetch(part.path).then(r => r.arrayBuffer());
            await loader.flashData(new Uint8Array(data), part.offset);
        }

        log("Rebooting...");
        await loader.disconnect();
        log("Complete.");
    } catch (err) {
        log("ERROR: " + err);
    }
}

document.getElementById("flashBtn").addEventListener("click", flash);
</script>

</body>
</html>
